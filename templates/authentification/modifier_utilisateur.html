{% load static %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container">
        <a class="navbar-brand" href="{% url 'admin_dashboard' %}">Espace Admin</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarAdmin">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarAdmin">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'gestion_utilisateurs' %}">Gestion des utilisateurs</a>
                </li>
            </ul>
            <div class="d-flex align-items-center">
                <span class="navbar-text me-3 text-white">
                    {{ user.first_name }} {{ user.last_name }}
                </span>
                <a href="{% url 'signout' %}" class="btn btn-outline-warning ms-2">
                    Se déconnecter
                </a>
            </div>
        </div>
    </div>
</nav>
<div class="container mt-5">
    <div class="card shadow-lg rounded-4">
        <div class="card-header bg-warning fw-bold">
            Modifier l’utilisateur
        </div>

        <div class="card-body">
            <form method="post">
                {% csrf_token %}

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Prénom</label>
                        {{ form.first_name }}
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Nom</label>
                        {{ form.last_name }}
                    </div>
                </div>

                <div class="mb-3">
                    <label>Email</label>
                    {{ form.email }}
                </div>

                <div class="mb-3">
                    <label>Nom d'utilisateur</label>
                    {{ form.username }}
                </div>

                <div class="text-end">
                    <a href="{% url 'gestion_utilisateurs' %}" class="btn btn-secondary">
                        Annuler
                    </a>
                    <button type="submit" class="btn btn-success">
                        Enregistrer
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<style>
      .navbar-custom {
        background: linear-gradient(90deg, #1e293b, #020617);
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .navbar-custom .navbar-brand {
        font-weight: 700;
        color: #ffc800 !important;
    }
    .navbar-custom .nav-link {
        color: #ffffff !important;
    }
    .navbar-custom .nav-link.active {
        font-weight: 600;
        text-decoration: underline;
    }
    .navbar-custom .btn-outline-warning {
        border-radius: 10px;
        font-weight: 500;
    }
    .navbar-custom .btn-outline-warning:hover {
        background-color: #ffc800;
        color: #020617;
    }
</style>
