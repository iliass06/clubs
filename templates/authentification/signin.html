{% load static %}
<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Se connecter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
body {
    background: #E9EAEC;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.card {
    background-color: rgba(255, 255, 255, 0.95);
    border-radius: 1rem;
    box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.3);
    max-width: 700px;
    width: 100%;
    border: 3px solid #FFC800; /* <-- contour jaune */
}

.rounded-t-5 {
  border-top-left-radius: 0.5rem;
  border-top-right-radius: 0.5rem;
}

.btn-custom {
    background-color: #FFC800;  /* jaune */
    color: #212529;              /* texte sombre */
    border: 2px solid #FFC800;   /* bordure jaune */
    transition: all 0.3s ease;
}

.btn-custom:hover {
    background-color: #e6b700;   /* jaune un peu plus foncé au survol */
    border-color: #e6b700;
    color: #212529;
    transform: translateY(-2px); /* léger effet "lift" */
}

@media (min-width: 992px) {
  .rounded-tr-lg-0 {
    border-top-right-radius: 0;
  }

  .rounded-bl-lg-5 {
    border-bottom-left-radius: 0.5rem;
  }
}
</style>

</head>
<body>

<div class="container">
  <div class="row justify-content-center align-items-center min-vh-100">
    <div class="col-lg-8 col-md-10">
      <div class="card mb-3">
        <div class="row g-0 d-flex align-items-center">

          <div class="col-lg-4 d-none d-lg-flex">
            <img src="{% static 'assets/img/lg.png' %}" 
                 alt="Illustration" 
                 class="w-100 rounded-t-5 rounded-tr-lg-0 rounded-bl-lg-5" />
          </div>

          <div class="col-lg-8">
            <div class="card-body py-5 px-md-5">

              <h2 class="mb-4 text-center">Se connecter</h2>

              {% for message in messages %}
                <div class="alert alert-warning">{{ message }}</div>
              {% endfor %}

              <form method="post">
                {% csrf_token %}

                <div class="form-outline mb-4">
                  <label class="form-label" for="username">Nom d'utilisateur</label>
                  <input type="text" id="username" name="username" class="form-control" required />
                </div>

                <div class="form-outline mb-4">
                  <label class="form-label" for="password">Mot de passe</label>
                  <input type="password" id="password" name="password" class="form-control" required />
                </div>

                <button type="submit" class="btn btn-custom w-100 mb-4">Se connecter</button>

                <div class="d-flex align-items-center justify-content-center mb-4">
                    <p class="mb-0 me-2">Pas encore de compte ?</p>
                    <a href="{% url 'signup' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}" class="text-primary fw-bold text-decoration-none">
                        Créer un compte
                    </a>
                </div>
                <div class="text-center mt-3">
                    <a href="{% url 'home' %}" class="text-decoration-none text-muted">
                        <i class="fas fa-arrow-left"></i> Retour à l'accueil
                    </a>
                </div>
              </form>

            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
